<!doctype html>
<html lang="ja" data-page="annual-review">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>グループの年間まとめ — Music Charts</title>
  <link rel="stylesheet" href="system-base.css">
  <link rel="stylesheet" href="apple-web.css">
  <link rel="stylesheet" href="refined-ui.css?v=annual-history-only-20261113">
  <link rel="stylesheet" href="annual-review.css?v=site-theme">
  <script defer src="data/manifest.js"></script>
  <script defer src="artist-photo-data.js?v=8loom-spotify"></script>
  <script defer src="jacket-data.js?v=weekly-20261125"></script>
  <script defer src="image-signature.js?v=2"></script>
  <script defer src="annual-review.js?v=image-signature-2"></script>
</head>
<body>
  <header class="top"><div class="wrap topin">
    <a class="brand" href="index.html"><span aria-hidden="true" class="mark"><svg viewBox="0 0 24 24"><path d="M5 17V11M12 17V5M19 17V8"/></svg></span>Music Charts</a>
    <nav aria-label="主な機能">
      <a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17 9 11l5 3 6-10"/></svg>チャート</a>
      <a href="records.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16M8 3v4M16 10v4M11 17v4"/></svg>記録・実績</a>
      <a href="releases.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/></svg>配信カレンダー</a>
      <a href="annual-review.html" class="is-current" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 19v-2a6 6 0 0 1 12 0v2m2-14a3 3 0 0 1 0 6m4 8v-2a5 5 0 0 0-4-5"/></svg>グループ一覧</a>
    </nav>
    <div class="sidebar-bottom">MUSIC CHART ANALYSIS<br>2025—2026</div>
  </div></header>
  <main>
    <section class="hero"><div class="wrap"><p class="eyebrow">国内ボーイズグループ</p><h1>グループの年間まとめ</h1></div></section>
    <div class="wrap review-content">
    <div class="review-controls">
      <label>グループ名で検索<input id="reviewSearch" type="search" autocomplete="off" placeholder="例：M!LK"></label>
      <label>年<select id="reviewYear"><option>2026</option><option>2025</option></select></label>
    </div>
    <details id="reviewDirectory" open>
      <summary>グループ一覧 <span id="reviewMatchCount"></span></summary>
      <ul id="reviewGroups"></ul>
      <button id="reviewMore" type="button" hidden>さらに表示</button>
    </details>
    <p id="reviewStatus" role="status" aria-live="polite"></p>
    <section id="reviewResult" hidden aria-labelledby="reviewName">
      <div class="review-toolbar">
        <h2><a id="reviewName"></a></h2>
        <label id="reviewPageLabel" hidden>ページ<select id="reviewPage"></select></label>
        <button id="reviewSave" type="button">画像を保存</button>
      </div>
      <canvas id="reviewCanvas" width="1200" height="1600" role="img" aria-describedby="reviewAlternative"></canvas>
      <div id="reviewAlternative" class="review-sr"></div>
      <details id="reviewReleases" hidden><summary>作品を開く</summary><ul id="reviewReleaseList"></ul></details>
    </section>
    </div>
  </main>
</body>
</html>
